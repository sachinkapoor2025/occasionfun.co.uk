# One pipeline for validation and deployment.
# A push to demo validates, then deploys that same commit and runs smoke tests.
# A pull request validates only. A push to main can deploy production only after
# the production variable, environment reviewers, and separate production
# credentials are all present. Demo credentials are never used for production.
name: CI/CD

"on":
  push:
    branches: [demo, main, master]
  pull_request:
    branches: [main, demo]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      NEXT_PUBLIC_SITE_URL: https://occasionfun.co.uk
      FAIL_ON_PLACEHOLDERS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/contact-api/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install contact API dependencies
        run: npm ci --prefix infra/contact-api

      - name: Lint
        run: npm run lint

      - name: Generate Next.js types
        run: npx next typegen

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm run test

      - name: Typecheck contact API
        run: npm run typecheck --prefix infra/contact-api

      - name: Test contact API
        run: npm test --prefix infra/contact-api

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true

      - name: Build contact API bundle
        run: npm run build --prefix infra/contact-api

      - name: SAM validate
        working-directory: infra/contact-api
        run: sam validate --lint --template template.yaml

      - name: Render demo template
        run: >-
          node scripts/render-contact-template.mjs
          --environment demo
          --output infra/contact-api/template.demo.yaml

      - name: SAM validate rendered demo template
        working-directory: infra/contact-api
        run: sam validate --lint --template template.demo.yaml

      - name: SAM build rendered demo template
        working-directory: infra/contact-api
        run: sam build --template template.demo.yaml

      - name: SAM validate retained demo permission template
        working-directory: infra/contact-api
        run: sam validate --lint --template demo-retry-permission.yaml

      - name: Render production physical names
        run: >-
          node scripts/render-contact-template.mjs
          --environment prod
          --output infra/contact-api/template.production.yaml

      - name: SAM validate production names
        working-directory: infra/contact-api
        run: sam validate --lint --template template.production.yaml

      - name: Upload rendered demo template
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contact-demo-template
          path: infra/contact-api/template.demo.yaml
          if-no-files-found: error
          retention-days: 1

      - name: Upload rendered production template
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contact-production-template
          path: infra/contact-api/template.production.yaml
          if-no-files-found: error
          retention-days: 1

      - name: Production static export
        run: npm run build

  deploy-demo:
    name: deploy demo
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/demo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require demo AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "GitHub repository secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must be set."
            exit 1
          fi

      - name: Configure demo AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Require the OccasionFun account
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$account" != "796174527529" ]; then
            echo "AWS account does not match the OccasionFun account."
            exit 1
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/contact-api/package-lock.json

      - name: Disable Amplify auto-build on the demo branch
        env:
          AMPLIFY_APP_ID: d2oib89bmco9su
          AMPLIFY_BRANCH: demo
          AWS_REGION: eu-west-2
        run: node scripts/amplify-demo-release.mjs disable-auto-build

      - name: Install frontend dependencies
        run: npm ci

      - name: Install contact API dependencies
        run: npm ci --prefix infra/contact-api

      - name: Build contact API bundle
        run: npm run build --prefix infra/contact-api

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true

      - name: Download the validated demo template
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: contact-demo-template
          path: infra/contact-api

      - name: SAM build
        working-directory: infra/contact-api
        run: sam build --template template.demo.yaml

      - name: Confirm the demo package has no retained permission
        working-directory: infra/contact-api
        run: |
          test -f template.demo.yaml
          test -f .aws-sam/build/template.yaml
          if grep -q "ContactRetryFunctionRetrySchedulePermission:" .aws-sam/build/template.yaml; then
            echo "Demo deployment package declares the retained retry permission."
            exit 1
          fi

      - name: Write demo parameters
        run: |
          cat > "$RUNNER_TEMP/contact-parameters.yaml" <<'EOF'
          Environment: demo
          SmtpSecretArn: arn:aws:secretsmanager:eu-west-2:796174527529:secret:occasionfun-co-uk/contact/smtp-32Px2G
          AllowedOrigins: "https://occasionfun.co.uk,https://www.occasionfun.co.uk,https://d2oib89bmco9su.amplifyapp.com,https://demo.d2oib89bmco9su.amplifyapp.com"
          EOF

      - name: Update the existing demo stack
        run: |
          bash scripts/deploy-contact-stack.sh \
            --environment demo \
            --stack-name occasionfun-co-uk-contact \
            --parameters-file "$RUNNER_TEMP/contact-parameters.yaml" \
            --allow-create false \
            --expected-table occasionfun-co-uk-leads \
            --expected-contact-function occasionfun-co-uk-contact \
            --expected-retry-function occasionfun-co-uk-contact-retry \
            --expected-contact-log-group /aws/lambda/occasionfun-co-uk-contact \
            --expected-retry-log-group /aws/lambda/occasionfun-co-uk-contact-retry \
            --expected-api-id 0e6zpkvbkj \
            --expected-endpoint https://0e6zpkvbkj.execute-api.eu-west-2.amazonaws.com/contact

      - name: Build the frontend with the demo API
        env:
          NEXT_PUBLIC_CONTACT_ENDPOINT: https://0e6zpkvbkj.execute-api.eu-west-2.amazonaws.com/contact
          NEXT_PUBLIC_SITE_URL: https://demo.d2oib89bmco9su.amplifyapp.com
          FAIL_ON_PLACEHOLDERS: "false"
        run: npm run build

      - name: Publish this commit on Amplify
        env:
          AMPLIFY_APP_ID: d2oib89bmco9su
          AMPLIFY_BRANCH: demo
          AWS_REGION: eu-west-2
        run: node scripts/amplify-demo-release.mjs release

  deploy-production:
    name: deploy production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require production reviewer protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if response="$(gh api --include "repos/${GITHUB_REPOSITORY}/environments/production" 2>&1)"; then
            gh_status=0
          else
            gh_status=$?
          fi
          printf '%s\n' "$response"
          http="$(printf '%s\n' "$response" | awk '/^HTTP\//{ code=$2 } END { print code }')"
          echo "GitHub environment API HTTP ${http:-none}; gh exit ${gh_status}."
          if [ "$gh_status" -ne 0 ] || [ "$http" != "200" ]; then
            if [ "$http" = "401" ] || [ "$http" = "403" ]; then
              echo "GitHub refused to read the production environment: HTTP ${http}."
              echo "This job uses the built-in token with contents and actions read. It cannot create the environment."
            elif [ "$http" = "404" ]; then
              echo "The production environment does not exist."
              echo "Create Settings → Environments → production and add a required reviewer before deploying."
            else
              echo "Could not verify the production GitHub Environment. Deployment stopped."
            fi
            exit 1
          fi
          body="$(printf '%s\n' "$response" | awk 'BEGIN { body=0 } body { print } /^[\r]*$/ { body=1 }')"
          reviewers="$(printf '%s' "$body" | jq '[.protection_rules[]? | select(.type=="required_reviewers")] | length')"
          echo "Required reviewer rules: ${reviewers}."
          if [ "$reviewers" -lt 1 ]; then
            echo "The production environment exists, but it has no required reviewer rule."
            echo "Open Settings → Environments → production → Deployment protection rules, enable Required reviewers, and choose at least one reviewer."
            exit 1
          fi
          echo "Production environment requires reviewer approval."

      - name: Mask the SMTP secret identifier
        run: echo "::add-mask::arn:aws:secretsmanager:eu-west-2:796174527529:secret:occasionfun-co-uk/contact/smtp-32Px2G"

      - name: Configure production AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Require the OccasionFun account
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$account" != "796174527529" ]; then
            echo "AWS account does not match the OccasionFun account."
            exit 1
          fi

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/contact-api/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install contact API dependencies
        run: npm ci --prefix infra/contact-api

      - name: Build contact API bundle
        run: npm run build --prefix infra/contact-api

      - name: Download the validated production template
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: contact-production-template
          path: infra/contact-api

      - name: SAM build
        working-directory: infra/contact-api
        run: sam build --template template.production.yaml

      - name: Write production parameters
        run: |
          cat > "$RUNNER_TEMP/contact-parameters.yaml" <<'EOF'
          Environment: prod
          SmtpSecretArn: arn:aws:secretsmanager:eu-west-2:796174527529:secret:occasionfun-co-uk/contact/smtp-32Px2G
          AllowedOrigins: "https://occasionfun.co.uk,https://www.occasionfun.co.uk"
          EOF

      - name: Create or update the production stack
        run: |
          bash scripts/deploy-contact-stack.sh \
            --environment prod \
            --stack-name occasionfun-co-uk-prod-contact \
            --role-arn arn:aws:iam::796174527529:role/occasionfun-cloudformation-production \
            --parameters-file "$RUNNER_TEMP/contact-parameters.yaml" \
            --allow-create true \
            --expected-table occasionfun-co-uk-prod-leads \
            --expected-contact-function occasionfun-co-uk-prod-contact \
            --expected-retry-function occasionfun-co-uk-prod-contact-retry \
            --expected-contact-log-group /aws/lambda/occasionfun-co-uk-prod-contact \
            --expected-retry-log-group /aws/lambda/occasionfun-co-uk-prod-contact-retry

      - name: Leave production hosting unchanged
        run: |
          echo "Production Amplify deployment is disabled."
          echo "This job does not call Amplify, publish the site, or change DNS."
          echo "Remaining setup is documented in DEPLOYMENT.md."
          echo "::notice::Production frontend deployment is disabled."

  smoke-test:
    name: smoke test
    needs: deploy-demo
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Check the demo site and API
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: node scripts/smoke-demo.mjs
