# GitHub Actions — CI only.
# Amplify Hosting is the planned deployment platform. This workflow must not
# deploy to S3. Dependencies are installed in the pipeline (never commit node_modules).
name: CI

"on":
  push:
    branches: [main, master, demo]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://occasionfun.co.uk
      FAIL_ON_PLACEHOLDERS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies (pipeline only)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Next.js types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Production static export
        run: npm run build

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: out
          retention-days: 7
