# GitHub Actions CI — installs packages during the pipeline run (not from the repo).
name: CI

# Quote "on" so YAML parsers never treat it as a boolean.
"on":
  push:
    branches: [main, master, demo]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies (pipeline only)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://occasionfun.co.uk
          FAIL_ON_PLACEHOLDERS: "false"
