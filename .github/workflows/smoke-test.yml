# Safe post-deployment checks for the demo site and the existing demo API.
# Requests are limited to a page fetch, a CORS preflight, and an invalid JSON body.
name: Smoke test

"on":
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy demo"]
    types: [completed]

permissions:
  contents: read

jobs:
  demo:
    name: demo smoke test
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Check the demo site and API
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: node scripts/smoke-demo.mjs
