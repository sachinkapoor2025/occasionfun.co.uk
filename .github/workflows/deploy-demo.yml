# Deploys the existing demo stack and then publishes the Amplify demo branch.
# Push and manual dispatch both disable demo auto-build before CI, the backend,
# and the frontend release. The change set is inspected before execution.
name: Deploy demo

"on":
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-demo-occasionfun-co-uk-contact
  cancel-in-progress: false

jobs:
  disable-demo-auto-build:
    name: disable demo auto-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "GitHub repository secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must be set."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Require the OccasionFun account
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$account" != "796174527529" ]; then
            echo "AWS account does not match the OccasionFun account."
            exit 1
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Disable Amplify auto-build on the demo branch
        env:
          AMPLIFY_APP_ID: d2oib89bmco9su
          AMPLIFY_BRANCH: demo
          AWS_REGION: eu-west-2
        run: node scripts/amplify-demo-release.mjs disable-auto-build

  wait-for-ci:
    name: wait for CI
    needs: disable-demo-auto-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - name: Wait until CI succeeds for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-for-ci.sh

  deploy:
    name: deploy demo
    needs: wait-for-ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - name: Require AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "GitHub repository secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must be set."
            exit 1
          fi

      - name: Mask the SMTP secret identifier
        run: echo "::add-mask::arn:aws:secretsmanager:eu-west-2:796174527529:secret:occasionfun-co-uk/contact/smtp-32Px2G"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/contact-api/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install contact API dependencies
        run: npm ci --prefix infra/contact-api

      - name: Build contact API bundle
        run: npm run build --prefix infra/contact-api

      - name: SAM build
        working-directory: infra/contact-api
        run: sam build --template template.yaml

      - name: Write demo parameters
        run: |
          cat > "$RUNNER_TEMP/contact-parameters.yaml" <<'EOF'
          Environment: demo
          SmtpSecretArn: arn:aws:secretsmanager:eu-west-2:796174527529:secret:occasionfun-co-uk/contact/smtp-32Px2G
          AllowedOrigins: "https://occasionfun.co.uk,https://www.occasionfun.co.uk,https://d2oib89bmco9su.amplifyapp.com,https://demo.d2oib89bmco9su.amplifyapp.com"
          EOF

      - name: Update the existing demo stack
        run: |
          bash scripts/deploy-contact-stack.sh \
            --environment demo \
            --stack-name occasionfun-co-uk-contact \
            --parameters-file "$RUNNER_TEMP/contact-parameters.yaml" \
            --allow-create false \
            --expected-table occasionfun-co-uk-leads \
            --expected-contact-function occasionfun-co-uk-contact \
            --expected-retry-function occasionfun-co-uk-contact-retry \
            --expected-contact-log-group /aws/lambda/occasionfun-co-uk-contact \
            --expected-retry-log-group /aws/lambda/occasionfun-co-uk-contact-retry \
            --expected-api-id 0e6zpkvbkj \
            --expected-endpoint https://0e6zpkvbkj.execute-api.eu-west-2.amazonaws.com/contact

      - name: Build the frontend with the demo API
        env:
          NEXT_PUBLIC_CONTACT_ENDPOINT: https://0e6zpkvbkj.execute-api.eu-west-2.amazonaws.com/contact
          NEXT_PUBLIC_SITE_URL: https://demo.d2oib89bmco9su.amplifyapp.com
          FAIL_ON_PLACEHOLDERS: "false"
        run: npm run build

      - name: Publish this commit on Amplify
        env:
          AMPLIFY_APP_ID: d2oib89bmco9su
          AMPLIFY_BRANCH: demo
          AWS_REGION: eu-west-2
        run: node scripts/amplify-demo-release.mjs release

  smoke:
    name: demo smoke test
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Check the demo site and API
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: node scripts/smoke-demo.mjs
