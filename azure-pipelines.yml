# Azure DevOps pipeline — build static Next.js export and upload to S3 (eu-west-2).
# Do not commit node_modules; install during the pipeline with npm ci.
# Set variable group / secret variables:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN (optional for temp creds)

trigger:
  branches:
    include:
      - main
      - master
      - demo

pool:
  vmImage: ubuntu-latest

variables:
  AWS_DEFAULT_REGION: eu-west-2
  S3_BUCKET: occasionfun.co.uk
  NEXT_PUBLIC_SITE_URL: https://occasionfun.co.uk
  FAIL_ON_PLACEHOLDERS: "false"

stages:
  - stage: Build
    displayName: Build static site
    jobs:
      - job: build
        displayName: npm ci + export
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "24.x"
            displayName: Use Node.js 24

          - script: npm ci
            displayName: Install dependencies (pipeline only)

          - script: |
              npm run lint
              npx next typegen
              npm run typecheck
              npm run test
              npm run build
            displayName: Lint, test, and static export

          - publish: out
            artifact: site-out
            displayName: Publish out/ artifact

  - stage: Deploy
    displayName: Deploy to S3 London
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: deploy
        displayName: aws s3 sync
        steps:
          - download: current
            artifact: site-out

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.x"

          - script: pip install awscli
            displayName: Install AWS CLI

          - script: |
              aws s3 sync "$(Pipeline.Workspace)/site-out/" "s3://$(S3_BUCKET)/" --delete \
                --region "$(AWS_DEFAULT_REGION)"
              echo "Deployed to s3://$(S3_BUCKET)/ (eu-west-2 website hosting)"
            displayName: Sync static files to S3
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
              AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
