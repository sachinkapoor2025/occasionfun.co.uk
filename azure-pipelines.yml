# Azure DevOps pipeline — CI only.
# Automatic triggers for main, master, and demo are disabled.
# The Deploy stage is retained so its history stays visible, and it cannot
# run. Amplify Hosting is the planned deployment platform. Do not sync the
# production bucket from this pipeline.
# Do not commit node_modules; install during the pipeline with npm ci.

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  NEXT_PUBLIC_SITE_URL: https://occasionfun.co.uk
  FAIL_ON_PLACEHOLDERS: "false"

stages:
  - stage: Build
    displayName: Build static site
    jobs:
      - job: build
        displayName: npm ci + export
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "24.x"
            displayName: Use Node.js 24

          - script: npm ci
            displayName: Install dependencies (pipeline only)

          - script: |
              npm run lint
              npx next typegen
              npm run typecheck
              npm run test
              npm run build
            displayName: Lint, test, and static export

          - publish: out
            artifact: site-out
            displayName: Publish out/ artifact

  - stage: Deploy
    displayName: Deploy disabled
    dependsOn: Build
    condition: false
    jobs:
      - job: deploy
        displayName: S3 deployment disabled
        steps:
          - script: |
              echo "Deploy stage is disabled and must not publish to S3."
              exit 1
            displayName: Refuse S3 deployment
