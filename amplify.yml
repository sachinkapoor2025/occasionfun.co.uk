# AWS Amplify Hosting build spec.
# Dependencies are installed here during the pipeline — never commit node_modules.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Prefer Node 24 to match package.json engines / .nvmrc
        - nvm install 24
        - nvm use 24
        - node -v
        - npm -v
        # Clean, lockfile-based install (no packages from the Git repo)
        - npm ci
        - npm run test
        - npm run lint
        - npm run typecheck
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      # Cache only; still reinstall/rebuild in pipeline — never source node_modules from Git
      - node_modules/**/*
      - .next/cache/**/*
