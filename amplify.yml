version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm ci --prefix infra/contact-api
    build:
      commands:
        # Next.js inlines NEXT_PUBLIC_* at build time. The script writes
        # .env.production from the branch rules: only the demo branch may use
        # the existing demo API. Every other branch refuses that API and does
        # not receive it as a fallback. The demo deployment workflow disables
        # auto-build for the demo branch before it starts a RELEASE job.
        # This file still runs inside that job. It does not change branch settings.
        - node scripts/amplify-public-env.mjs
        - set -a && . ./.env.production && set +a && npm run build
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
